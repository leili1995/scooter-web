
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Scooter Showcase - Netherlands</title>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-4xl font-bold text-center mb-12">Product Catalog</h1>
    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

    <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition p-6 border border-gray-200">
        <img src="images/scooter1.jpg" class="w-full h-64 object-contain mb-4">
        <div class="flex justify-between items-start mb-2">
            <h2 class="text-2xl font-bold">NL-City Light</h2>
            <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded">Road Legal (NL)</span>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-4 text-sm text-gray-600">
            <div class="bg-gray-50 p-3 rounded"><b>Speed:</b> 25 km/h</div>
            <div class="bg-gray-50 p-3 rounded"><b>Range:</b> 40km</div>
            <div class="bg-gray-50 p-3 rounded"><b>Battery:</b> 36V 10Ah</div>
            <div class="bg-gray-50 p-3 rounded text-blue-600 font-bold"><b>Price:</b> €449</div>
        </div>
        <button class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">Order Inquiry</button>
    </div>
    
    <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition p-6 border border-gray-200">
        <img src="images/scooter2.jpg" class="w-full h-64 object-contain mb-4">
        <div class="flex justify-between items-start mb-2">
            <h2 class="text-2xl font-bold">NL-Speed Master</h2>
            <span class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded">Private Road Only</span>
        </div>
        <div class="grid grid-cols-2 gap-4 mt-4 text-sm text-gray-600">
            <div class="bg-gray-50 p-3 rounded"><b>Speed:</b> 45 km/h</div>
            <div class="bg-gray-50 p-3 rounded"><b>Range:</b> 75km</div>
            <div class="bg-gray-50 p-3 rounded"><b>Battery:</b> 48V 15Ah</div>
            <div class="bg-gray-50 p-3 rounded text-blue-600 font-bold"><b>Price:</b> €899</div>
        </div>
        <button class="w-full mt-6 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">Order Inquiry</button>
    </div>
    </div></body></html>
